name: CI/CD & Multi-Platform Release

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Lint & Tests Job ────────────────────────────────────────────────────────
  test-and-lint:
    name: Lint & Typecheck Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint || true
        continue-on-error: true

      - name: TypeScript Verification (Web)
        run: npx tsc -b

      - name: TypeScript Verification (Electron)
        run: npm run build:electron

  # ─── Build Linux ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (AppImage + deb)
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase service account (if secret provided)
        shell: bash
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > alasel-954c7-firebase-adminsdk-fbsvc-247d2212b7.json
          fi

      - name: Build Vite (React app)
        run: npm run build

      - name: Compile Electron TypeScript
        run: npm run build:electron

      - name: Build Electron Linux packages
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alasel-motors-linux
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 30

  # ─── Build Windows ───────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (NSIS Installer)
    needs: test-and-lint
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase service account (if secret provided)
        shell: bash
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > alasel-954c7-firebase-adminsdk-fbsvc-247d2212b7.json
          fi

      - name: Build Vite (React app)
        run: npm run build

      - name: Compile Electron TypeScript
        run: npm run build:electron

      - name: Build Electron Windows installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alasel-motors-windows
          path: |
            release/*.exe
            release/*.zip
          retention-days: 30

  # ─── Automated Release Publisher ─────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create release files directory
        run: mkdir -p dist_release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: alasel-motors-linux
          path: dist_release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: alasel-motors-windows
          path: dist_release

      - name: List downloaded release assets
        run: ls -lh dist_release

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.tag }}
          name: "الوكالة موتورز ${{ steps.pkg_version.outputs.tag }} — تحديث منظومة الفواتير وتنبيهات أوراق الإفراج"
          body: |
            ### 🚀 إصدار رسمي جديد: الوكالة موتورز ${{ steps.pkg_version.outputs.tag }}

            #### ✨ أهم التحديثات في هذا الإصدار:
            - **تنبيه تسليم أوراق الإفراج الجمركي (+30 يوماً):** شريط تنبيه وبادجات ذكية وفلاتر سريعة للعملاء الذين مضى على فواتيرهم أكثر من شهر دون استلام الورق.
            - **دعم متكامل للوضعين الداكن والفاتح** في صفحة الفواتير وكافة شاشات النظام.
            - **تضمين أرشيف الفواتير الموحد** (1,834 سجل ومحرك) مدمجاً ومحملاً ذاتياً في التطبيق 100% دون أخطاء شبكة.
            - **حزم ويندوز متعددة:** مثبت نظام Setup + نسخة محمولة Portable تعمل فوراً دون تثبيت + حزمة مضغوطة ZIP.
            - **حزم لينكس:** AppImage و deb.
          draft: false
          prerelease: false
          files: |
            dist_release/*
